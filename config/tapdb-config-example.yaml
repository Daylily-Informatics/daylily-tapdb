# Example TAPDB CLI config
#
# Save as:
#   ~/.config/tapdb/<client-id>/<database-name>/tapdb-config.yaml
#
# Runtime commands require the explicit config path:
#   tapdb --config ~/.config/tapdb/<client-id>/<database-name>/tapdb-config.yaml ...

meta:
  config_version: 4
  client_id: local
  database_name: tapdb
  owner_repo_name: daylily-tapdb
  # Local runtime registry fixture. Public domain-code allocation is governed by
  # meridian-registry 0.1.1 through meridian-euid 0.4.8.
  domain_registry_path: ~/.config/tapdb/domain_code_registry.json
  # Prefix claims remain domain-holder governed and are not centralized in
  # meridian-registry.
  prefix_ownership_registry_path: ~/.config/tapdb/prefix_ownership_registry.json

admin:
  footer:
    repo_url: https://github.com/Daylily-Informatics/daylily-tapdb
  session:
    secret: replace-me
  auth:
    mode: tapdb
    disabled_user:
      email: tapdb-admin@localhost
      role: admin
    shared_host:
      session_secret: ""
      session_cookie: session
      session_max_age_seconds: 1209600
  cors:
    allowed_origins: []
  ui:
    tls:
      cert_path: ""
      key_path: ""
  metrics:
    enabled: true
    queue_max: 20000
    flush_seconds: 1.0
  db_pool_size: 5
  db_max_overflow: 10
  db_pool_timeout: 30
  db_pool_recycle: 1800

target:
  engine_type: local
  host: localhost
  port: 5533
  ui_port: 8911
  user: daylily
  password: ""
  # Optional fixed runtime tenant. Empty/absent is an explicit global-only
  # deployment; request parameters never widen this database scope.
  tenant_id: ""
  allow_global_claims: false
  # Required by schema apply/migrate/drift and global template seed. This must
  # authenticate as a distinct PostgreSQL SUPERUSER or BYPASSRLS role.
  operator:
    user: tapdb_operator
    password: ""
    secret_arn: ""
    iam_auth: false
  database: tapdb_local
  schema_name: tapdb_local
  domain_code: Z
  support_email: support@example.com

safety:
  safety_tier: local
  destructive_operations: confirm_required
