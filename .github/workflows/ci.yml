name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install quality tooling
        run: python -m pip install -e ".[dev,cli,aurora,gui]"

      - name: Ruff check
        run: >-
          ruff check daylily_tapdb admin tests
          scripts/ci_prepare_postgres_config.py
          scripts/verify_changed_coverage.py
          scripts/verify_wheel_assets.py

      - name: Ruff format
        run: >-
          ruff format --check daylily_tapdb admin tests
          scripts/ci_prepare_postgres_config.py
          scripts/verify_changed_coverage.py
          scripts/verify_wheel_assets.py

      - name: Mypy release surfaces
        # pyproject.toml lists every new 10.0 module explicitly. The older dynamic
        # ORM/Typer surfaces remain outside this strict gate until modernized.
        run: mypy

  security:
    name: Bandit and detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tooling
        run: python -m pip install "bandit[toml]" detect-secrets

      - name: Bandit
        run: bandit -c pyproject.toml -r daylily_tapdb admin

      - name: Detect verified secrets
        run: |
          detect-secrets scan --all-files --only-verified \
            --exclude-files '(^|/)(\.git|\.venv|\.mypy_cache|\.pytest_cache|\.ruff_cache|dist|build)/' \
            > detect-secrets.json
          python -c 'import json, pathlib; report = json.loads(pathlib.Path("detect-secrets.json").read_text()); results = report.get("results"); print("verified secrets detected" if results else "no verified secrets detected"); raise SystemExit(bool(results))'

  test:
    name: PostgreSQL ${{ matrix.postgres_label }} full suite
    runs-on: ubuntu-latest
    needs: [quality, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres_label: '16.13'
            postgres_image: postgres:16.13
            postgres_major: '16'
          - postgres_label: '17'
            postgres_image: postgres:17
            postgres_major: '17'

    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: tapdb_operator
          POSTGRES_PASSWORD: operator-password
          POSTGRES_DB: tapdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapdb_operator -d tapdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: operator-password
      TAPDB_RUN_DOCS_LOCAL: '1'
      TAPDB_TEST_CONFIG: /tmp/tapdb-ci/tapdb-config.yaml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install PostgreSQL ${{ matrix.postgres_major }} client and server tools
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes \
            "postgresql-${{ matrix.postgres_major }}" \
            "postgresql-client-${{ matrix.postgres_major }}"
          echo "/usr/lib/postgresql/${{ matrix.postgres_major }}/bin" >> "$GITHUB_PATH"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli,aurora,gui]"

      - name: Install Chromium for GUI acceptance
        run: python -m playwright install --with-deps chromium

      - name: Create explicit PostgreSQL ${{ matrix.postgres_label }} runtime role and config
        run: |
          psql -h localhost -p 5432 -U tapdb_operator -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tapdb_runtime LOGIN PASSWORD 'runtime-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION"
          psql -h localhost -p 5432 -U tapdb_operator -d tapdb \
            -v ON_ERROR_STOP=1 \
            -c "REVOKE CREATE ON DATABASE tapdb FROM PUBLIC; GRANT CONNECT ON DATABASE tapdb TO tapdb_runtime; REVOKE CREATE ON SCHEMA public FROM PUBLIC"
          python scripts/ci_prepare_postgres_config.py

      - name: Apply and seed explicit target
        env:
          PGPASSWORD: runtime-password
        run: |
          tapdb --config "$TAPDB_TEST_CONFIG" db schema apply
          tapdb --config "$TAPDB_TEST_CONFIG" db data seed

      - name: Run complete tests with branch coverage and docs-local examples
        env:
          PGPASSWORD: runtime-password
        run: >-
          python -m pytest tests -q
          --tapdb-config "$TAPDB_TEST_CONFIG"
          --cov=daylily_tapdb
          --cov=admin
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=90

      - name: Require 90 percent in every changed production module
        run: >-
          python scripts/verify_changed_coverage.py
          --base origin/main
          --report coverage.json
          --minimum 90

  build:
    name: Build and installed-wheel smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build distributions
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: '10.0.0'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify wheel schema and migration assets
        run: python scripts/verify_wheel_assets.py --expected-version 10.0.0

      - name: Smoke-test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          wheels=(dist/*.whl)
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "${wheels[0]}[gui]"
          export TAPDB_TEST_CONFIG="$RUNNER_TEMP/wheel-smoke-config/tapdb-config.yaml"
          "$RUNNER_TEMP/wheel-smoke/bin/python" scripts/ci_prepare_postgres_config.py
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from daylily_tapdb.external_references import ExternalReferenceService; from daylily_tapdb.federation import DagV2FederationClient; from daylily_tapdb.gui import create_tapdb_gui_app; assert ExternalReferenceService and DagV2FederationClient and callable(create_tapdb_gui_app)"
          "$RUNNER_TEMP/wheel-smoke/bin/tapdb" --help
          "$RUNNER_TEMP/wheel-smoke/bin/tapdb" --config "$TAPDB_TEST_CONFIG" info --json
          "$RUNNER_TEMP/wheel-smoke/bin/tapdb" --config "$TAPDB_TEST_CONFIG" templates --help
          "$RUNNER_TEMP/wheel-smoke/bin/tapdb" --config "$TAPDB_TEST_CONFIG" objects --help
          "$RUNNER_TEMP/wheel-smoke/bin/tapdb" validation external-references --help
