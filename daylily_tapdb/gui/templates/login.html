{% extends "auth_base.html" %}
{% block title %}Sign in · TapDB{% endblock %}
{% block auth_content %}
<form method="post" action="{{ tapdb_gui_url(request, '/login') }}" class="stacked-form">
  <label>Email or username <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
<p><a href="{{ tapdb_gui_url(request, '/auth/login') }}">Continue with Google</a></p>
<p><a href="{{ tapdb_gui_url(request, '/signup') }}">Create an account</a></p>
{% endblock %}
