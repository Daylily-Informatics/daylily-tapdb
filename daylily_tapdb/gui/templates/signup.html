{% extends "auth_base.html" %}
{% block title %}Create account · TapDB{% endblock %}
{% block auth_content %}
<form method="post" action="{{ tapdb_gui_url(request, '/signup') }}" class="stacked-form">
  <label>Email <input type="email" name="email" autocomplete="email" required autofocus></label>
  <label>Display name <input name="display_name" autocomplete="name"></label>
  <label>Password <input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
  <label>Confirm password <input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
  <button type="submit">Create account</button>
</form>
<p><a href="{{ tapdb_gui_url(request, '/auth/login') }}">Continue with Google</a></p>
<p><a href="{{ tapdb_gui_url(request, '/login') }}">Return to sign in</a></p>
{% endblock %}
