[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daylily-tapdb"
dynamic = ["version"]
description = "Templated Abstract Polymorphic Database - A flexible object model library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Daylily Informatics", email = "info@daylilyinformatics.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
keywords = ["database", "orm", "polymorphic", "templates", "sqlalchemy", "lims"]

dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic",
    "jsonschema>=4.0",
    "typer",
    "rich",
    "pyyaml",
    "uuid6>=2024.1.12",
    "cli-core-yo==2.1.1",
    "meridian-euid==0.4.8",
]

[project.optional-dependencies]
dev = [
    "cli-core-yo==2.1.1",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "playwright>=1.45",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "httpx",
    "python-multipart",
    "pre-commit>=3.8.0",
    "bandit[toml]>=1.8.0",
    "detect-secrets>=1.4",
    "setuptools_scm>=8.0",
]

# Optional CLI add-ons.
#
# Note: The CLI itself (Typer + Rich + PyYAML) is intentionally part of core deps so
# `tapdb --help` works after `pip install -e .` per REFACTOR_TAPDB.md Phase 0.
cli = [
]

# Optional Aurora (AWS RDS Aurora) support.
aurora = [
    "boto3>=1.34",
    "botocore",
]

# Optional reusable API surface.
api = [
    "fastapi",
]

# Optional canonical GUI surface for standalone and host-session FastAPI apps.
gui = [
    "fastapi",
    "jinja2",
    "uvicorn",
    "python-multipart",
    "itsdangerous",
    "daylily-auth-cognito==2.1.5",
    # passlib 1.7.x is not compatible with bcrypt>=4 (bcrypt enforces 72-byte
    # password max and passlib's backend self-test uses a longer sentinel).
    # Pin to bcrypt<4 to keep admin auth usable.
    "passlib[bcrypt]",
    "bcrypt<4",
]

[project.scripts]
tapdb = "daylily_tapdb.cli:main"

[project.urls]
Homepage = "https://github.com/Daylily-Informatics/daylily-tapdb"
Repository = "https://github.com/Daylily-Informatics/daylily-tapdb.git"
Documentation = "https://daylily-tapdb.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["daylily_tapdb*", "admin*"]

[tool.setuptools.package-data]
daylily_tapdb = [
    "core_config/_metadata.json",
    "core_config/*/*.json",
    "etc/*.json",
    "gui/static/css/*.css",
    "gui/static/js/*.js",
    "gui/templates/*.html",
    "templates/schema/*.json",
]
[tool.setuptools.data-files]
"schema" = ["schema/tapdb_schema.sql", "schema/rls.sql"]
"schema/migrations" = ["schema/migrations/*.sql"]
"docs" = ["docs/*.md"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "daylily_tapdb/_version.py"
write_to_template = "__version__ = \"{version}\"\n"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["daylily_tapdb", "admin"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"daylily_tapdb/models/*.py" = ["N801"]
"admin/db_pool.py" = ["N806"]
# These fakes mirror boto3's PascalCase keyword arguments (Bucket=, Key=,
# DBClusterIdentifier=). Renaming them would make each double diverge from the
# API it stands in for, which is the whole point of the tests.
"tests/test_backup_storage_s3.py" = ["N803"]
"tests/test_backup_snapshots.py" = ["N803"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
# TapDB's older dynamically mapped ORM and Typer surfaces are not yet globally
# strict-clean. Keep the release gate explicit and expand it as those modules
# are modernized; every new 10.0 implementation module is checked here.
files = [
    "daylily_tapdb/advisory_locks.py",
    "daylily_tapdb/external_reference_audit.py",
    "daylily_tapdb/external_references.py",
    "daylily_tapdb/federation.py",
    "daylily_tapdb/migration_identity.py",
    "daylily_tapdb/runtime_info.py",
    "daylily_tapdb/security_context.py",
    "daylily_tapdb/services/graph_payloads.py",
    "daylily_tapdb/services/object_operations.py",
    "daylily_tapdb/services/object_search.py",
    "daylily_tapdb/templates/repository.py",
    "daylily_tapdb/web/dag_v2.py",
    "daylily_tapdb/cli/objects.py",
    "daylily_tapdb/cli/templates.py",
]

[tool.bandit]
targets = ["daylily_tapdb", "admin"]
exclude_dirs = ["tests", "dist", "build"]
skips = [
    "B101",  # assert used in tests and defensive validation paths
    "B105",  # hardcoded_password_string false positives on field names/defaults
    "B110",  # intentional best-effort cleanup/logging paths
    "B112",  # intentional defensive continue patterns if added later
    "B311",  # non-cryptographic randomness if added later
    "B404",  # CLI/admin intentionally use subprocess for trusted tools
    "B603",  # subprocess calls execute trusted local commands
    "B607",  # subprocess calls rely on known PATH tools (git, psql, lsof, etc.)
    "B608",  # SQL fragments are operator-authored/static, not raw user interpolation
]
